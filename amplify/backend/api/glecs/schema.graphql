type Bill
  @model(subscriptions: null)
  @auth(
    rules: [
      {
        allow: groups
        groups: ["SUPERADMIN", "ADMIN", "VAIBHAV"]
        operations: [create, update, delete, read]
      }
      { allow: groups, groups: ["STAFF"], operations: [read] }
    ]
  ) {
  id: ID!
  companyId: ID!
    @index(
      name: "byCompany"
      sortKeyFields: ["billedAt"]
      queryField: "billsByCompany"
    )
  createdBy: AWSEmail
    @index(
      name: "byCreatedBy"
      sortKeyFields: ["billedAt"]
      queryField: "billsByCreatedBy"
    )
  billType: BillType!
  billedAt: AWSDateTime!
  status: BillStatus!
  totalAmount: Float!
  customerId: ID
    @index(
      name: "byCustomer"
      sortKeyFields: ["billedAt"]
      queryField: "billsByCustomer"
    )
  notes: String
  company: Company @belongsTo(fields: ["companyId"])
  creator: UserProfile @belongsTo(fields: ["createdBy"])
  customer: Customer @belongsTo(fields: ["customerId"])
  items: [BillItem] @hasMany(indexName: "byBill", fields: ["id"])
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

type BillItem
  @model(subscriptions: null)
  @auth(
    rules: [
      {
        allow: groups
        groups: ["SUPERADMIN", "ADMIN", "VAIBHAV"]
        operations: [create, update, delete, read]
      }
      { allow: groups, groups: ["STAFF"], operations: [read] }
    ]
  ) {
  id: ID!
  billId: ID!
    @index(
      name: "byBill"
      sortKeyFields: ["lineNumber"]
      queryField: "billItemsByBill"
    )
  lineNumber: Int!
  description: String
  productId: ID
    @index(
      name: "byProduct"
      sortKeyFields: ["billId"]
      queryField: "billItemsByProduct"
    )
  quantity: Int
  unitPrice: Float
  lineTotal: Float
  bill: Bill @belongsTo(fields: ["billId"])
  product: Product @belongsTo(fields: ["productId"])
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}
